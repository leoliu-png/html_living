[project]
name = "service-deployer-backend"
version = "0.1.0"
description = "Python backend for the internal service deployer."
requires-python = ">=3.9"
dependencies = [
    "boto3>=1.35.0",
    "beautifulsoup4>=4.9.0",
    "fastapi>=0.115.0",
    "google-auth>=2.34.0",
    "httpx>=0.28.0",
    "itsdangerous>=2.2.0",
    "markdownify>=1.2.2",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "requests>=2.32.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP045"]
